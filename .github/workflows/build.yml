name: Build Listo

# Every push and pull request builds and tests on all platforms.
#
# Merging is releasing: when a push to main carries a version (listo/__init__.py __version__) that has no tag
# yet, this same run builds, tags that exact commit vX.Y.Z and publishes the GitHub Release with the downloads
# and the version's CHANGELOG notes. (A tag made with the workflow's own token doesn't start another workflow,
# so the release can't wait for a tag-triggered run.) Pull requests never release. Pushing a tag by hand still
# works, but only if it matches __version__.
# Actions are pinned to exact commits (a tag can be moved; a commit can't). Dependabot proposes updates.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the build never needs to push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - name: Format check
        run: ruff format --check .
      - name: Lint (style, bugs, security)
        run: ruff check .
      - name: Is this a release?
        # main: release when vX.Y.Z (from __version__) has no tag yet. A pushed tag: it must match __version__
        # (a release whose app reports an older number keeps offering itself as an update). Pull requests: never.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('listo/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          tag="v$v"
          release=false
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag $REF_NAME doesn't match __version__ $v in listo/__init__.py. Bump the version, commit, then tag."
              exit 1
            fi
            if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
              echo "Release $tag already exists: building only."
            else
              release=true
            fi
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            if gh api "repos/$REPO/git/ref/tags/$tag" --silent > /dev/null 2>&1; then
              echo "$tag is already released: building only."
            else
              awk -v v="$v" '$1 == "##" && $2 == v { f = 1 } END { exit !f }' CHANGELOG.md ||
                echo "::warning::CHANGELOG.md has no '## $v' section: the release will have no notes."
              echo "Releasing $tag from this commit once the builds pass."
              release=true
            fi
          fi
          {
            echo "version=$v"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the build never needs to push

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libgl1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download ffmpeg to bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # (only to avoid GitHub's rate limit when reading its releases)
        run: python scripts/fetch_ffmpeg.py

      - name: Run tests (with the bundled ffmpeg)
        shell: bash
        run: |
          export PATH="$PWD/vendor/ffmpeg:$PATH"
          set +e
          python -m pytest -v -p no:cacheprovider > pytest.log 2>&1
          code=$?
          tail -n 300 pytest.log
          # Qt can crash while Python shuts down AFTER every test has passed (Windows does this);
          # what counts is pytest's own verdict on its last line.
          if [ $code -ne 0 ] && python -c "import re,sys; last=[l for l in open('pytest.log',encoding='utf-8',errors='replace').read().splitlines() if l.startswith('=')][-1]; sys.exit(0 if re.search(r' passed', last) and not re.search(r'failed|error', last) else 1)"; then
            echo "All tests passed (exit code $code came from shutting down afterwards)."
            code=0
          fi
          if [ $code -ne 0 ]; then
            # Show the end of the test output as an annotation on the run's summary page too
            # (readable without opening the full log).
            python -c "import sys; lines = open('pytest.log', encoding='utf-8', errors='replace').read().splitlines()[-60:]; print('::error title=Tests failed (exit $code)::' + '%0A'.join(l.replace('%', '%25').replace(chr(13), '') for l in lines))"
          fi
          exit $code

      - name: Build app
        run: pyinstaller listo.spec --noconfirm

      # the signing certificate is only handed to the signing step (never to installs, tests or the build)
      - name: Is signing set up?
        id: signing
        if: runner.os == 'macOS'
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
        run: echo "ready=$HAS_CERT" >> "$GITHUB_OUTPUT"

      # ---------- smoke tests: launch the packaged app and convert a file
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./vendor/ffmpeg/ffmpeg -hide_banner -v error -f lavfi -i testsrc2=s=320x240:d=1 -c:v libx264 smoke.MOV
          dist/Listo.app/Contents/MacOS/Listo --smoke-test
          dist/Listo.app/Contents/MacOS/Listo cli smoke.MOV --video prores
          test -f smoke_2.mov

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./vendor/ffmpeg/ffmpeg -hide_banner -v error -f lavfi -i testsrc2=s=320x240:d=1 -c:v libx264 smoke.mp4
          dist/Listo/Listo --smoke-test
          dist/Listo/Listo cli smoke.mp4 --video prores
          test -f smoke.mov

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\vendor\ffmpeg\ffmpeg.exe -hide_banner -v error -f lavfi -i testsrc2=s=320x240:d=1 -c:v libx264 smoke.mp4
          $p = Start-Process -FilePath dist\Listo\Listo.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath dist\Listo\Listo.exe -ArgumentList "cli","smoke.mp4","--video","prores" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CLI smoke test failed: $($p.ExitCode)" }
          if (-not (Test-Path smoke.mov)) { throw "no output" }

      # ---------- optional: sign + notarize on macOS (only if you add the secrets — see README)
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$CERT"' EXIT  # gone even if a step below fails
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$CERT" -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          find dist/Listo.app -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" \) -print0 | \
            xargs -0 codesign --force --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" || true
          codesign --force --deep --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/Listo.app
          ditto -c -k --keepParent dist/Listo.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Listo.app

      # ---------- package
      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          cp -R dist/Listo.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Listo" -srcfolder dmg -ov -format UDZO "out/Listo-${{ matrix.name }}.dmg"

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\Listo -DestinationPath out\Listo-windows-portable.zip

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (python -c "import listo; print(listo.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v packaging\windows\listo.iss
          Copy-Item packaging\windows\Output\Listo-Setup.exe out\Listo-windows-setup.exe

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp packaging/linux/install.sh packaging/linux/listo.desktop listo/assets/icon.png dist/Listo/
          chmod +x dist/Listo/install.sh
          tar -C dist -czf out/Listo-linux-x64.tar.gz Listo

      - name: Package (Linux AppImage, one file)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash packaging/linux/build_appimage.sh dist/Listo out/Listo-linux-x64.AppImage
          out/Listo-linux-x64.AppImage --smoke-test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Listo-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    # only a push (to main, or a matching tag) whose version has no release yet; never a pull request
    if: github.event_name == 'push' && needs.lint.outputs.release == 'true'
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # two quick merges: their releases run one after the other, and the second finds the tag already made
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.lint.outputs.tag }}
      VERSION: ${{ needs.lint.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tag this commit (once)
        id: tag
        # Making the tag is the lock: only one run can create refs/tags/vX.Y.Z. If it's already there (a run
        # that finished first, or a tag pushed by hand), this run publishes nothing new.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              echo "Release $TAG already exists."
              echo "go=false" >> "$GITHUB_OUTPUT"
            else
              echo "go=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" --silent; then
            echo "Tagged $SHA as $TAG."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          at=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null || true)
          if [ "$at" = "$SHA" ] && ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "$TAG is already on this commit but has no release yet (a re-run): publishing it."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG already exists on another commit or is released: nothing to release."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes (downloads, then this version's CHANGELOG)
        if: steps.tag.outputs.go == 'true'
        run: |
          {
            echo "## Download"
            echo "| Your computer | File |"
            echo "|---|---|"
            echo "| Mac with Apple Silicon (M1 and newer) | \`Listo-mac-apple-silicon.dmg\` |"
            echo "| Intel Mac | \`Listo-mac-intel.dmg\` |"
            echo "| Windows (installer) | \`Listo-windows-setup.exe\` |"
            echo "| Windows (no install) | \`Listo-windows-portable.zip\` |"
            echo "| Linux (one file, double-click to run) | \`Listo-linux-x64.AppImage\` |"
            echo "| Linux (folder + install script) | \`Listo-linux-x64.tar.gz\` |"
            echo
            echo "Everything Listo needs (including ffmpeg) is inside, nothing else to install."
            echo "**First launch on Mac:** if macOS says it can't check the app, open **System Settings → Privacy & Security** and click **Open Anyway**."
            echo "**First launch on Windows:** if SmartScreen appears, click **More info → Run anyway**."
            echo
            echo "## What's New in $VERSION"
            awk -v v="$VERSION" '$0 ~ "^## " { if (on) exit; if ($2 == v) { on = 1; next } } on' CHANGELOG.md
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.tag.outputs.go == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.tag.outputs.go == 'true'
        with:
          tag_name: ${{ needs.lint.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Listo ${{ needs.lint.outputs.version }}
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
